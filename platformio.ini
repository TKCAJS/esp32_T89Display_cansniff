; ASMG-MD servo CAN sniffer — diagnostic firmware for the T89 display node.
; Temporary tool: flash this to nail down the servo protocol, then reflash the
; node with esp32_T89Display. Hardware config is copied from that project.

[platformio]
boards_dir = boards

[env:esp32s3_cansniff]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-8048S043C
framework = arduino

lib_deps = https://github.com/rzeldent/esp32-smartdisplay.git
extra_scripts = pre:copy_lv_conf.py

board_build.f_cpu = 240000000L
board_build.flash_speed = 80m
board_build.flash_mode = qio

upload_speed = 921600
monitor_speed = 115200

lib_extra_dirs = lib

build_flags =
    -I ${PROJECT_DIR}/include
    -DCORE_DEBUG_LEVEL=3
